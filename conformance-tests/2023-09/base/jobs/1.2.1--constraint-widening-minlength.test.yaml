# Merging job parameter definitions intersects their constraints (§1.2.1), so a later
# definition may relax an earlier minLength and simply has no effect.
#
# The job template is processed after the environment template and declares minLength 2
# over the environment's 5. The 10-character default satisfies both, which isolates the
# merge direction from any constraint violation. Paired with
# 1.2.1--constraint-widening-minlength-binds.invalid.test.yaml, which shows 5 is what
# binds.
#
# The merge must succeed and the task must print the value. An implementation reading
# §1.2.1 as a rule about each definition rather than the result refuses the job outright.
template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Value
    type: STRING
    minLength: 2
    default: test-value
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args:
          - -c
          - print(r'VALUE[{{Param.Value}}]')
environments:
- specificationVersion: environment-2023-09
  parameterDefinitions:
  - name: Value
    type: STRING
    minLength: 5
  environment:
    name: TestEnv
    variables:
      VAL: '{{Param.Value}}'
expected:
  output:
  - VALUE[test-value]
