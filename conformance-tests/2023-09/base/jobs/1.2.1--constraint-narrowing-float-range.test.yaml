template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Scale
    type: FLOAT
    minValue: 1.0
    maxValue: 5.0
    default: 2.5
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["Scale=2.5"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - print(r'Scale={{Param.Scale}}')
environments:
- specificationVersion: environment-2023-09
  parameterDefinitions:
  - name: Scale
    type: FLOAT
    minValue: 0.0
    maxValue: 10.0
    default: 2.5
  environment:
    name: TestEnv
    variables:
      SCALE: '{{Param.Scale}}'
expected:
  output:
  - Scale=2.5
