template:
  specificationVersion: jobtemplate-2023-09
  name: '{{Param.Project}}-{{Param.Shot}}-v{{Param.Version}}'
  parameterDefinitions:
  - name: Project
    type: STRING
  - name: Shot
    type: STRING
  - name: Version
    type: INT
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["OUTPUT:MyProject"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - print(r'OUTPUT:{{Param.Project}}')
parameters:
  Project: MyProject
  Shot: shot_010
  Version: 3
expected:
  output:
  - OUTPUT:MyProject
