template:
  specificationVersion: jobtemplate-2023-09
  name: Job-{{Param.Version}}
  parameterDefinitions:
  - name: Version
    type: STRING
    default: default
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["OUTPUT:default"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - print(r'OUTPUT:{{Param.Version}}')
expected:
  output:
  - OUTPUT:default
