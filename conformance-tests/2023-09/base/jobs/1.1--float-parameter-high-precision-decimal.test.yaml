template:
  specificationVersion: jobtemplate-2023-09
  name: Job-{{Param.Scale}}
  parameterDefinitions:
  - name: Scale
    type: FLOAT
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["OUTPUT:3.141592653589793"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - print(r'OUTPUT:{{Param.Scale}}')
parameters:
  Scale: '3.141592653589793'
expected:
  output:
  - OUTPUT:3.141592653589793
