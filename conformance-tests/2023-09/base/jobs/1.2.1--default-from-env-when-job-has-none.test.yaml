template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Quality
    type: STRING
    allowedValues:
    - low
    - medium
    - high
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["MERGE:default=medium"], "forbidden": ["MERGE:default=low", "MERGE:default=high"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - print(r'MERGE:default={{Param.Quality}}')
environments:
- specificationVersion: environment-2023-09
  parameterDefinitions:
  - name: Quality
    type: STRING
    default: medium
    allowedValues:
    - low
    - medium
    - high
  environment:
    name: TestEnv
    variables:
      QUALITY: '{{Param.Quality}}'
expected:
  output:
  - MERGE:default=medium
  forbidden:
  - MERGE:default=low
  - MERGE:default=high
