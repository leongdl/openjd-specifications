template:
  specificationVersion: jobtemplate-2023-09
  name: EnvStdoutSetVar
  jobEnvironments:
  - name: SetVarEnv
    script:
      actions:
        onEnter:
          command: python
          args:
          - -c
          - 'print(''openjd_env: MY_VAR=myvalue'')'
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["MY_VAR_IS:myvalue"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - import os; print('MY_VAR_IS:' + os.environ.get('MY_VAR', ''))
expected:
  output:
  - MY_VAR_IS:myvalue
