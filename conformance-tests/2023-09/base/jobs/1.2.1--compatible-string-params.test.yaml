template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Config
    type: STRING
    default: job-default
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["MERGE:Config=job-default"], "forbidden": ["\u007b\u007bParam.", "env-default"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - print(r'MERGE:Config={{Param.Config}}')
environments:
- specificationVersion: environment-2023-09
  parameterDefinitions:
  - name: Config
    type: STRING
    default: env-default
  environment:
    name: TestEnv
    variables:
      CONFIG: '{{Param.Config}}'
expected:
  output:
  - MERGE:Config=job-default
  forbidden:
  - '{{Param.'
  - env-default
