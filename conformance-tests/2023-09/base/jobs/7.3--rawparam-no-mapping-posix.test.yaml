runOn: [posix]

template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: InputPath
    type: PATH
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["RAW:/original/path", "MAPPED:/mapped/path"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - print(r'RAW:{{RawParam.InputPath}}');print(r'MAPPED:{{Param.InputPath}}')

parameters:
  InputPath: /original/path

pathMapping:
- source_path_format: POSIX
  source_path: /original
  destination_path: /mapped

expected:
  output:
  - RAW:/original/path
  - MAPPED:/mapped/path
