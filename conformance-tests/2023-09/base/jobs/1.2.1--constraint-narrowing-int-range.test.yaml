template:
  specificationVersion: jobtemplate-2023-09
  name: TestJob
  parameterDefinitions:
  - name: Count
    type: INT
    minValue: 10
    maxValue: 100
    default: 50
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["Count=50"], "forbidden": ["Count=0"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - print(r'Count={{Param.Count}}')
environments:
- specificationVersion: environment-2023-09
  parameterDefinitions:
  - name: Count
    type: INT
    minValue: 0
    maxValue: 1000
    default: 0
  environment:
    name: TestEnv
    variables:
      COUNT: '{{Param.Count}}'
expected:
  output:
  - Count=50
  forbidden:
  - Count=0
