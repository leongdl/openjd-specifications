# Schema §3.3.2.1: user-defined host attribute names must not use the
# reserved 'worker' scope — 'attr.worker.*' is reserved for capabilities
# defined by Open Job Description itself.
#
# Formerly misnamed 3.3.2--both-anyof-allof: the rule that name implied
# ("at least one of anyOf or allOf") does not exist — coexistence is legal
# and covered by 3.3.2--custom-attribute-anyof-and-allof.yaml. The reserved
# scope is the rule this fixture actually exercises, pinned below with both
# implementations' phrasings.
# expectedError:
#   anyOf:
#   - "uses reserved scope 'worker'"
#   - "Only Open Job Description defined capabilities may start with 'attr.worker'"
specificationVersion: jobtemplate-2023-09
name: TestJob
steps:
- name: Step1
  hostRequirements:
    attributes:
    - name: attr.worker.capabilities
      anyOf:
      - a
      allOf:
      - b
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
