template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["STRIP:[hi]", "LSTRIP:[hi  ]", "RSTRIP:[  hi]"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'STRIP:[{{ strip("  hi  ") }}]')
            print(r'LSTRIP:[{{ lstrip("  hi  ") }}]')
            print(r'RSTRIP:[{{ rstrip("  hi  ") }}]')
expected:
  output:
  - STRIP:[hi]
  - "LSTRIP:[hi  ]"
  - "RSTRIP:[  hi]"
