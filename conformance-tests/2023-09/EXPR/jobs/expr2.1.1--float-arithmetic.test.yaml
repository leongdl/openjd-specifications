template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: X
    type: INT
    default: 2
  - name: Y
    type: FLOAT
    default: 1.5
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["FADD:4.0", "PROMOTE:3.5", "FSUB:3.5", "FMUL:3.0", "FMOD:1.5"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'FADD:{{ 1.5 + 2.5 }}')
            print(r'PROMOTE:{{ Param.X + Param.Y }}')
            print(r'FSUB:{{ 5.0 - 1.5 }}')
            print(r'FMUL:{{ Param.Y * 2 }}')
            print(r'FMOD:{{ 7.5 % 2.0 }}')
expected:
  output:
  - FADD:4.0
  - PROMOTE:3.5
  - FSUB:3.5
  - FMUL:3.0
  - FMOD:1.5
