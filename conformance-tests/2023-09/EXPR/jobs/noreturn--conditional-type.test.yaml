template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: X
    type: INT
    default: 5
  - name: Flag
    type: BOOL
    default: true
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["INT:15", "BOOL:yes"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - >-
            print(r'INT:{{ (Param.X if Param.X > 0 else fail("bad")) + 10 }}')

            print(r'BOOL:{{ "yes" if (Param.Flag or fail("required")) else "no" }}')
expected:
  output:
  - "INT:15"
  - "BOOL:yes"
