template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Verbose
    type: BOOL
    default: false
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["ARGS:--input file.exr"], "forbidden": ["--verbose", "--quality"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            import sys
            sys.stdout.write('ARGS:')
            sys.stdout.write(' '.join(sys.argv[1:]))
            sys.stdout.write('\n')
          - "--input"
          - "file.exr"
          - "{{ '--verbose' if Param.Verbose else null }}"
          - "{{ ['--quality', '90'] if Param.Verbose else null }}"
expected:
  output:
  - "ARGS:--input file.exr"
  forbidden:
  - "--verbose"
  - "--quality"
