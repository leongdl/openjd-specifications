template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["FOUND:6", "NOT_FOUND:-1", "START:0"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'FOUND:{{ find("hello world", "world") }}')
            print(r'NOT_FOUND:{{ find("hello world", "xyz") }}')
            print(r'START:{{ find("hello", "hel") }}')
expected:
  output:
  - FOUND:6
  - NOT_FOUND:-1
  - START:0
