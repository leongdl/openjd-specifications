template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["STOP:[0, 1, 2, 3, 4]", "START_STOP:[1, 2, 3, 4]", "STEP:[0, 2, 4, 6, 8]", "NEG:[5, 4, 3, 2, 1]", "EMPTY:[]", "EMPTY2:[]"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'STOP:{{ range(5) }}')
            print(r'START_STOP:{{ range(1, 5) }}')
            print(r'STEP:{{ range(0, 10, 2) }}')
            print(r'NEG:{{ range(5, 0, -1) }}')
            print(r'EMPTY:{{ range(0) }}')
            print(r'EMPTY2:{{ range(5, 5) }}')
expected:
  output:
  - "STOP:[0, 1, 2, 3, 4]"
  - "START_STOP:[1, 2, 3, 4]"
  - "STEP:[0, 2, 4, 6, 8]"
  - "NEG:[5, 4, 3, 2, 1]"
  - "EMPTY:[]"
  - "EMPTY2:[]"
