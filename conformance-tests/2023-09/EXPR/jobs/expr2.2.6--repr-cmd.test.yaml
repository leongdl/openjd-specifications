template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    let:
    - 'simple = repr_cmd("hello")'
    - 'amp = repr_cmd("a & b")'
    - 'pipe = repr_cmd("x | y")'
    - 'caret = repr_cmd("a ^ b")'
    - 'angles = repr_cmd("a < b > c")'
    - "dquote = repr_cmd(\"say \\\"hi\\\"\")"
    - 'parens = repr_cmd("(foo)")'
    - 'pct = repr_cmd("100%")'
    - 'bang = repr_cmd("hello!")'
    - 'bang_var = repr_cmd("!PATH!")'
    - 'bang_caret = repr_cmd("a ^ b!")'
    - 'spaces = repr_cmd("hello world")'
    - |-
      newline = repr_cmd("a\nb")
    - |-
      newline_r = repr_cmd("a\rb")
    - |-
      newline_rn = repr_cmd("a\r\nb")
    - "list_val = repr_cmd([\"echo\", \"a & b\"])"
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        data: |
          # Self-asserting conformance wrapper. Runs `sys.argv[1:]` -- this case's original
          # command, expanded by the implementation -- echoes its output so a runner that
          # scans logs still sees the same lines, then checks that output against the
          # literals below and exits non-zero on mismatch, so task exit status alone carries
          # the verdict. The literals are literals, and diagnostics report a line's position
          # rather than its text; conformance-tests/README.md, "Self-asserting job tests",
          # says why both matter.
          import subprocess
          import sys

          EXPECTED = [
              "SIMPLE:hello",
              "AMP:\"a & b\"",
              "PIPE:\"x | y\"",
              "CARET:\"a ^^ b\"",
              "ANGLES:\"a < b > c\"",
              "DQUOTE:\"say ^\"hi^\"\"",
              "PARENS:\"(foo)\"",
              "PCT:\"100%%\"",
              "BANG:\"hello^^!\"",
              "BANG_VAR:\"^^!PATH^^!\"",
              "BANG_CARET:\"a ^^ b^^!\"",
              "SPACES:\"hello world\"",
              "NEWLINE_STRIPPED:ab",
              "NEWLINE_R_STRIPPED:ab",
              "NEWLINE_RN_STRIPPED:ab",
              "LIST:echo \"a & b\"",
          ]
          FORBIDDEN = []
          completed = subprocess.run(sys.argv[1:], capture_output=True, text=True)
          sys.stdout.write(completed.stdout)
          sys.stderr.write(completed.stderr)
          output = completed.stdout + completed.stderr

          problems = []
          if completed.returncode != 0:
              problems.append("command exited with code %d" % completed.returncode)
          problems += ["expected output line %d of %d not found" % (i, len(EXPECTED))
                       for i, line in enumerate(EXPECTED, 1) if line not in output]
          problems += ["forbidden output line %d of %d was present" % (i, len(FORBIDDEN))
                       for i, line in enumerate(FORBIDDEN, 1) if line in output]

          for problem in problems:
              sys.stderr.write("OPENJD_CONFORMANCE_ASSERT_FAILED: %s\n" % problem)
          if problems:
              sys.exit(1)
          sys.stdout.write("OPENJD_CONFORMANCE_ASSERT_OK: %d expected, %d forbidden\n"
                           % (len(EXPECTED), len(FORBIDDEN)))
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - python
          - -c
          - |
            print(r'SIMPLE:{{ simple }}')
            print(r'AMP:{{ amp }}')
            print(r'PIPE:{{ pipe }}')
            print(r'CARET:{{ caret }}')
            print(r'ANGLES:{{ angles }}')
            print(r'DQUOTE:{{ dquote }}')
            print(r'PARENS:{{ parens }}')
            print(r'PCT:{{ pct }}')

            print(r'BANG:{{ bang }}')
            print(r'BANG_VAR:{{ bang_var }}')
            print(r'BANG_CARET:{{ bang_caret }}')
            print(r'SPACES:{{ spaces }}')
            print(r'NEWLINE_STRIPPED:{{ newline }}')
            print(r'NEWLINE_R_STRIPPED:{{ newline_r }}')
            print(r'NEWLINE_RN_STRIPPED:{{ newline_rn }}')
            print(r'LIST:{{ list_val }}')
expected:
  output:
  - SIMPLE:hello
  - "AMP:\"a & b\""
  - "PIPE:\"x | y\""
  - "CARET:\"a ^^ b\""
  - "ANGLES:\"a < b > c\""
  - "DQUOTE:\"say ^\"hi^\"\""
  - "PARENS:\"(foo)\""
  - "PCT:\"100%%\""
  - "BANG:\"hello^^!\""
  - "BANG_VAR:\"^^!PATH^^!\""
  - "BANG_CARET:\"a ^^ b^^!\""
  - "SPACES:\"hello world\""
  - "NEWLINE_STRIPPED:ab"
  - "NEWLINE_R_STRIPPED:ab"
  - "NEWLINE_RN_STRIPPED:ab"
  - "LIST:echo \"a & b\""
