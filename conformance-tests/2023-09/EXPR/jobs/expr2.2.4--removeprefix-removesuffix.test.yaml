template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["RP_MATCH:Hook", "RP_NONE:TestHook", "RS_MATCH:render", "RS_NONE:render.exr"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'RP_MATCH:{{ removeprefix("TestHook", "Test") }}')
            print(r'RP_NONE:{{ removeprefix("TestHook", "Xyz") }}')
            print(r'RS_MATCH:{{ removesuffix("render.exr", ".exr") }}')
            print(r'RS_NONE:{{ removesuffix("render.exr", ".png") }}')
expected:
  output:
  - RP_MATCH:Hook
  - RP_NONE:TestHook
  - RS_MATCH:render
  - RS_NONE:render.exr
