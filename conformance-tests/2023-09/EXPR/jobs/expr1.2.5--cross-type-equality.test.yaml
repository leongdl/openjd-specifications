template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    let:
    - 'r = range_expr("1-3")'
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        data: |
          # Self-asserting conformance wrapper. Runs `sys.argv[1:]` -- this case's original
          # command, expanded by the implementation -- echoes its output so a runner that
          # scans logs still sees the same lines, then checks that output against the
          # literals below and exits non-zero on mismatch, so task exit status alone carries
          # the verdict. The literals are literals, and diagnostics report a line's position
          # rather than its text; conformance-tests/README.md, "Self-asserting job tests",
          # says why both matter.
          import subprocess
          import sys

          EXPECTED_POSIX = [
              "LIST_RANGE:true",
              "RANGE_LIST:true",
              "SCALAR_LIST:false",
              "ELEM_CROSS:true",
              "NESTED_CROSS:true",
              "BOOL_INT:false",
              "BOOL_STR:false",
              "STR_INT:false",
              "NULL_ZERO:false",
              "NULL_NULL:true",
              "LIST_DIFF_LEN:false",
              "STR_PATH:true",
              "PATH_STR:true",
          ]
          EXPECTED_WINDOWS = [
              "LIST_RANGE:true",
              "RANGE_LIST:true",
              "SCALAR_LIST:false",
              "ELEM_CROSS:true",
              "NESTED_CROSS:true",
              "BOOL_INT:false",
              "BOOL_STR:false",
              "STR_INT:false",
              "NULL_ZERO:false",
              "NULL_NULL:true",
              "LIST_DIFF_LEN:false",
              "STR_PATH:false",
              "PATH_STR:false",
          ]
          EXPECTED = EXPECTED_WINDOWS if sys.platform == "win32" else EXPECTED_POSIX
          FORBIDDEN = []
          completed = subprocess.run(sys.argv[1:], capture_output=True, text=True)
          sys.stdout.write(completed.stdout)
          sys.stderr.write(completed.stderr)
          output = completed.stdout + completed.stderr

          problems = []
          if completed.returncode != 0:
              problems.append("command exited with code %d" % completed.returncode)
          problems += ["expected output line %d of %d not found" % (i, len(EXPECTED))
                       for i, line in enumerate(EXPECTED, 1) if line not in output]
          problems += ["forbidden output line %d of %d was present" % (i, len(FORBIDDEN))
                       for i, line in enumerate(FORBIDDEN, 1) if line in output]

          for problem in problems:
              sys.stderr.write("OPENJD_CONFORMANCE_ASSERT_FAILED: %s\n" % problem)
          if problems:
              sys.exit(1)
          sys.stdout.write("OPENJD_CONFORMANCE_ASSERT_OK: %d expected, %d forbidden\n"
                           % (len(EXPECTED), len(FORBIDDEN)))
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - python
          - -c
          - |
            print(r'LIST_RANGE:{{ [1, 2, 3] == range_expr("1-3") }}')
            print(r'RANGE_LIST:{{ range_expr("1-3") == [1, 2, 3] }}')
            print(r'SCALAR_LIST:{{ 1 == [1] }}')
            print(r'STR_PATH:{{ "/a/b" == path("/a/b") }}')
            print(r'PATH_STR:{{ path("/a/b") == "/a/b" }}')
            print(r'ELEM_CROSS:{{ [5] == [5.0] }}')
            print(r'NESTED_CROSS:{{ [[5]] == [[5.0]] }}')
            print(r'BOOL_INT:{{ true == 1 }}')
            print(r'BOOL_STR:{{ true == "true" }}')
            print(r'STR_INT:{{ "5" == 5 }}')
            print(r'NULL_ZERO:{{ null == 0 }}')
            print(r'NULL_NULL:{{ null == null }}')
            print(r'LIST_DIFF_LEN:{{ [1, 2] == [1, 2, 3] }}')
expected:
  output:
  - LIST_RANGE:true
  - RANGE_LIST:true
  - SCALAR_LIST:false
  - ELEM_CROSS:true
  - NESTED_CROSS:true
  - BOOL_INT:false
  - BOOL_STR:false
  - STR_INT:false
  - NULL_ZERO:false
  - NULL_NULL:true
  - LIST_DIFF_LEN:false
  # On POSIX, path("/a/b") keeps "/a/b" so string == path is true.
  # On Windows, path("/a/b") normalizes to "\a\b" so string "/a/b" != path "\a\b".
  output_posix:
  - STR_PATH:true
  - PATH_STR:true
  output_windows:
  - STR_PATH:false
  - PATH_STR:false
