template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["POSEXP:8", "NEGEXP:0.125", "FEXP:8.0", "ZEROEXP:1", "ZEROF:1.0"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'POSEXP:{{ 2 ** 3 }}')
            print(r'NEGEXP:{{ 2 ** -3 }}')
            print(r'FEXP:{{ 2.0 ** 3.0 }}')
            print(r'ZEROEXP:{{ 2 ** 0 }}')
            print(r'ZEROF:{{ 5.0 ** 0 }}')
expected:
  output:
  - POSEXP:8
  - NEGEXP:0.125
  - FEXP:8.0
  - ZEROEXP:1
  - ZEROF:1.0
