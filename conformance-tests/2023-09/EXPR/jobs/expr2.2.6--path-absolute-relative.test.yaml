template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        data: |
          # Self-asserting conformance wrapper. Runs `sys.argv[1:]` -- this case's original
          # command, expanded by the implementation -- echoes its output so a runner that
          # scans logs still sees the same lines, then checks that output against the
          # literals below and exits non-zero on mismatch, so task exit status alone carries
          # the verdict. The literals are literals, and diagnostics report a line's position
          # rather than its text; conformance-tests/README.md, "Self-asserting job tests",
          # says why both matter.
          import subprocess
          import sys

          EXPECTED_POSIX = [
              "ABS_REL:[false]",
              "ABS_URI:[true]",
              "REL_TO_URI_T:[true]",
              "REL_TO_URI_F:[false]",
              "REL_TO_URI_SAME:[true]",
              "REL_TO_MIX:[false]",
              "RELATIVE_URI:[file.txt]",
              "RELATIVE_URI_SAME:[.]",
              "ABS_POSIX:[true]",
              "ABS_WIN:[false]",
              "ABS_UNC:[true]",
              "REL_TO_POSIX_T:[true]",
              "REL_TO_POSIX_F:[false]",
              "REL_TO_UNC_T:[true]",
              "REL_TO_UNC_F:[false]",
              "RELATIVE_POSIX:[c/d]",
              "RELATIVE_UNC:[dir/file]",
              "RELATIVE_URI_NESTED:[a/b/c]",
          ]
          EXPECTED_WINDOWS = [
              "ABS_REL:[false]",
              "ABS_URI:[true]",
              "REL_TO_URI_T:[true]",
              "REL_TO_URI_F:[false]",
              "REL_TO_URI_SAME:[true]",
              "REL_TO_MIX:[false]",
              "RELATIVE_URI:[file.txt]",
              "RELATIVE_URI_SAME:[.]",
              "ABS_POSIX:[false]",
              "ABS_WIN:[true]",
              "ABS_UNC:[true]",
              "REL_TO_POSIX_T:[true]",
              "REL_TO_POSIX_F:[false]",
              "REL_TO_UNC_T:[true]",
              "REL_TO_UNC_F:[false]",
              "RELATIVE_POSIX:[c\\d]",
              "RELATIVE_UNC:[dir\\file]",
              "RELATIVE_URI_NESTED:[a\\b\\c]",
          ]
          EXPECTED = EXPECTED_WINDOWS if sys.platform == "win32" else EXPECTED_POSIX
          FORBIDDEN = []
          completed = subprocess.run(sys.argv[1:], capture_output=True, text=True)
          sys.stdout.write(completed.stdout)
          sys.stderr.write(completed.stderr)
          output = completed.stdout + completed.stderr

          problems = []
          if completed.returncode != 0:
              problems.append("command exited with code %d" % completed.returncode)
          problems += ["expected output line %d of %d not found" % (i, len(EXPECTED))
                       for i, line in enumerate(EXPECTED, 1) if line not in output]
          problems += ["forbidden output line %d of %d was present" % (i, len(FORBIDDEN))
                       for i, line in enumerate(FORBIDDEN, 1) if line in output]

          for problem in problems:
              sys.stderr.write("OPENJD_CONFORMANCE_ASSERT_FAILED: %s\n" % problem)
          if problems:
              sys.exit(1)
          sys.stdout.write("OPENJD_CONFORMANCE_ASSERT_OK: %d expected, %d forbidden\n"
                           % (len(EXPECTED), len(FORBIDDEN)))
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - python
          - -c
          - |
            print(r'ABS_POSIX:[{{ path("/a/b").is_absolute() }}]')
            print(r'ABS_REL:[{{ path("a/b").is_absolute() }}]')
            print(r'ABS_URI:[{{ path("s3://bucket/key").is_absolute() }}]')
            print(r'ABS_WIN:[{{ path("C:/a/b").is_absolute() }}]')
            print(r'ABS_UNC:[{{ path("//server/share/dir").is_absolute() }}]')
            print(r'REL_TO_POSIX_T:[{{ path("/a/b/c").is_relative_to(path("/a/b")) }}]')
            print(r'REL_TO_POSIX_F:[{{ path("/a/b/c").is_relative_to(path("/x/y")) }}]')
            print(r'REL_TO_UNC_T:[{{ path("//server/share/dir/file").is_relative_to(path("//server/share")) }}]')
            print(r'REL_TO_UNC_F:[{{ path("//server/share/dir").is_relative_to(path("//other/share")) }}]')
            print(r'REL_TO_URI_T:[{{ path("s3://bucket/key/file").is_relative_to(path("s3://bucket/key")) }}]')
            print(r'REL_TO_URI_F:[{{ path("s3://bucket1/key").is_relative_to(path("s3://bucket2")) }}]')
            print(r'REL_TO_URI_SAME:[{{ path("s3://bucket/key").is_relative_to(path("s3://bucket/key")) }}]')
            print(r'REL_TO_MIX:[{{ path("s3://bucket/key").is_relative_to(path("a/b")) }}]')
            print(r'RELATIVE_POSIX:[{{ path("/a/b/c/d").relative_to(path("/a/b")) }}]')
            print(r'RELATIVE_UNC:[{{ path("//server/share/dir/file").relative_to(path("//server/share")) }}]')
            print(r'RELATIVE_URI:[{{ path("s3://bucket/key/file.txt").relative_to(path("s3://bucket/key")) }}]')
            print(r'RELATIVE_URI_NESTED:[{{ path("s3://bucket/a/b/c").relative_to(path("s3://bucket")) }}]')
            print(r'RELATIVE_URI_SAME:[{{ path("s3://bucket/key").relative_to(path("s3://bucket/key")) }}]')
expected:
  output:
  - ABS_REL:[false]
  - ABS_URI:[true]
  - REL_TO_URI_T:[true]
  - REL_TO_URI_F:[false]
  - REL_TO_URI_SAME:[true]
  - REL_TO_MIX:[false]
  - RELATIVE_URI:[file.txt]
  - RELATIVE_URI_SAME:[.]
  output_posix:
  - ABS_POSIX:[true]
  - ABS_WIN:[false]
  - ABS_UNC:[true]
  - REL_TO_POSIX_T:[true]
  - REL_TO_POSIX_F:[false]
  - REL_TO_UNC_T:[true]
  - REL_TO_UNC_F:[false]
  - RELATIVE_POSIX:[c/d]
  - RELATIVE_UNC:[dir/file]
  - RELATIVE_URI_NESTED:[a/b/c]
  output_windows:
  - ABS_POSIX:[false]
  - ABS_WIN:[true]
  - ABS_UNC:[true]
  - REL_TO_POSIX_T:[true]
  - REL_TO_POSIX_F:[false]
  - REL_TO_UNC_T:[true]
  - REL_TO_UNC_F:[false]
  - RELATIVE_POSIX:[c\d]
  - RELATIVE_UNC:[dir\file]
  - "RELATIVE_URI_NESTED:[a\\b\\c]"
