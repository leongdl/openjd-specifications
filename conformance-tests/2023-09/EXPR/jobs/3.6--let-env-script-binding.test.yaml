template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  jobEnvironments:
  - name: TestEnv
    script:
      let:
      - "greeting = 'hello'"
      actions:
        onEnter:
          command: python
          args:
          - -c
          - "print('openjd_env: GREETING={{ greeting }}')"
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["ENV:hello"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - import os; print('ENV:' + os.environ.get('GREETING', ''))
expected:
  output:
  - ENV:hello
