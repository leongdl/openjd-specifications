template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["INT:5", "FLOAT:3.14", "POS:5"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'INT:{{ abs(-5) }}')
            print(r'FLOAT:{{ abs(-3.14) }}')
            print(r'POS:{{ abs(5) }}')
expected:
  output:
  - INT:5
  - FLOAT:3.14
  - POS:5
