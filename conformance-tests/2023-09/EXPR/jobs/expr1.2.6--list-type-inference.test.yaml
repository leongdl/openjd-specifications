template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    # List literals are evaluated in step-level let (TEMPLATE scope) so that
    # path() uses PurePosixPath for cross-platform consistency (Expression
    # Language §2.3.2). In host context, path() would use native OS semantics.
    let:
    - 'homo_int = [1, 2, 3]'
    - 'homo_float = [1.0, 2.0]'
    - 'homo_str = ["a", "b"]'
    - 'homo_path = [path("/a"), path("/b")]'
    - 'mix_int_float = [1, 2.0]'
    - 'mix_path_str = [path("/a"), "b"]'
    - 'empty = []'
    - 'nested_int = [[1, 2], [3, 4]]'
    - 'nested_float = [[1.0, 2.0], [3.0, 4.0]]'
    - 'nested_str = [["a", "b"], ["c"]]'
    - 'nested_path = [[path("/a")], [path("/b")]]'
    - 'nested_mix_int_float = [[1], [2.0]]'
    - 'nested_mix_path_str = [[path("/a")], ["b"]]'
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        data: |
          # Self-asserting conformance wrapper. Runs `sys.argv[1:]` -- this case's original
          # command, expanded by the implementation -- echoes its output so a runner that
          # scans logs still sees the same lines, then checks that output against the
          # literals below and exits non-zero on mismatch, so task exit status alone carries
          # the verdict. The literals are literals, and diagnostics report a line's position
          # rather than its text; conformance-tests/README.md, "Self-asserting job tests",
          # says why both matter.
          import subprocess
          import sys

          EXPECTED_POSIX = [
              "HOMO_INT:[1, 2, 3]",
              "HOMO_FLOAT:[1.0, 2.0]",
              "HOMO_STR:[\"a\", \"b\"]",
              "MIX_INT_FLOAT:[1.0, 2.0]",
              "MIX_PATH_STR:[\"/a\", \"b\"]",
              "EMPTY:[]",
              "NESTED_INT:[[1, 2], [3, 4]]",
              "NESTED_FLOAT:[[1.0, 2.0], [3.0, 4.0]]",
              "NESTED_STR:[[\"a\", \"b\"], [\"c\"]]",
              "NESTED_MIX_INT_FLOAT:[[1.0], [2.0]]",
              "NESTED_MIX_PATH_STR:[[\"/a\"], [\"b\"]]",
              "HOMO_PATH:[\"/a\", \"/b\"]",
              "NESTED_PATH:[[\"/a\"], [\"/b\"]]",
          ]
          EXPECTED_WINDOWS = [
              "HOMO_INT:[1, 2, 3]",
              "HOMO_FLOAT:[1.0, 2.0]",
              "HOMO_STR:[\"a\", \"b\"]",
              "MIX_INT_FLOAT:[1.0, 2.0]",
              "MIX_PATH_STR:[\"/a\", \"b\"]",
              "EMPTY:[]",
              "NESTED_INT:[[1, 2], [3, 4]]",
              "NESTED_FLOAT:[[1.0, 2.0], [3.0, 4.0]]",
              "NESTED_STR:[[\"a\", \"b\"], [\"c\"]]",
              "NESTED_MIX_INT_FLOAT:[[1.0], [2.0]]",
              "NESTED_MIX_PATH_STR:[[\"/a\"], [\"b\"]]",
              "HOMO_PATH:[\"\\a\", \"\\b\"]",
              "NESTED_PATH:[[\"\\a\"], [\"\\b\"]]",
          ]
          EXPECTED = EXPECTED_WINDOWS if sys.platform == "win32" else EXPECTED_POSIX
          FORBIDDEN = []
          completed = subprocess.run(sys.argv[1:], capture_output=True, text=True)
          sys.stdout.write(completed.stdout)
          sys.stderr.write(completed.stderr)
          output = completed.stdout + completed.stderr

          problems = []
          if completed.returncode != 0:
              problems.append("command exited with code %d" % completed.returncode)
          problems += ["expected output line %d of %d not found" % (i, len(EXPECTED))
                       for i, line in enumerate(EXPECTED, 1) if line not in output]
          problems += ["forbidden output line %d of %d was present" % (i, len(FORBIDDEN))
                       for i, line in enumerate(FORBIDDEN, 1) if line in output]

          for problem in problems:
              sys.stderr.write("OPENJD_CONFORMANCE_ASSERT_FAILED: %s\n" % problem)
          if problems:
              sys.exit(1)
          sys.stdout.write("OPENJD_CONFORMANCE_ASSERT_OK: %d expected, %d forbidden\n"
                           % (len(EXPECTED), len(FORBIDDEN)))
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - python
          - -c
          - |
            print(r'HOMO_INT:{{ homo_int }}')
            print(r'HOMO_FLOAT:{{ homo_float }}')
            print(r'HOMO_STR:{{ homo_str }}')
            print(r'HOMO_PATH:{{ homo_path }}')
            print(r'MIX_INT_FLOAT:{{ mix_int_float }}')
            print(r'MIX_PATH_STR:{{ mix_path_str }}')
            print(r'EMPTY:{{ empty }}')
            print(r'NESTED_INT:{{ nested_int }}')
            print(r'NESTED_FLOAT:{{ nested_float }}')
            print(r'NESTED_STR:{{ nested_str }}')
            print(r'NESTED_PATH:{{ nested_path }}')
            print(r'NESTED_MIX_INT_FLOAT:{{ nested_mix_int_float }}')
            print(r'NESTED_MIX_PATH_STR:{{ nested_mix_path_str }}')
expected:
  output:
  - "HOMO_INT:[1, 2, 3]"
  - "HOMO_FLOAT:[1.0, 2.0]"
  - 'HOMO_STR:["a", "b"]'
  - "MIX_INT_FLOAT:[1.0, 2.0]"
  # MIX_PATH_STR coerces to list[string] in TEMPLATE scope → POSIX everywhere
  - 'MIX_PATH_STR:["/a", "b"]'
  - "EMPTY:[]"
  - "NESTED_INT:[[1, 2], [3, 4]]"
  - "NESTED_FLOAT:[[1.0, 2.0], [3.0, 4.0]]"
  - 'NESTED_STR:[["a", "b"], ["c"]]'
  - "NESTED_MIX_INT_FLOAT:[[1.0], [2.0]]"
  # NESTED_MIX_PATH_STR coerces to list[list[string]] → POSIX everywhere
  - 'NESTED_MIX_PATH_STR:[["/a"], ["b"]]'
  output_posix:
  - 'HOMO_PATH:["/a", "/b"]'
  - 'NESTED_PATH:[["/a"], ["/b"]]'
  output_windows:
  - "HOMO_PATH:[\"\\a\", \"\\b\"]"
  - "NESTED_PATH:[[\"\\a\"], [\"\\b\"]]"
