runOn: [windows]
# URI PATH job parameters with implicit path mapping (Expression Language §1.2.1, §2.3.2)
# When PATH parameters contain URIs and path mapping rules match, Param.<name>
# receives the mapped local path while RawParam.<name> preserves the original URI.
# This tests the implicit mapping that happens during parameter processing,
# not the explicit apply_path_mapping() function.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: S3File
    type: PATH
    default: "s3://my-bucket/assets/teapot.obj"
  - name: HttpFile
    type: PATH
    default: "https://cdn.example.com/models/scene.obj"
  - name: UnmappedFile
    type: PATH
    default: "fsx://vol/data/file.bin"
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        data: |
          # Self-asserting conformance wrapper. Runs `sys.argv[1:]` -- this case's original
          # command, expanded by the implementation -- echoes its output so a runner that
          # scans logs still sees the same lines, then checks that output against the
          # literals below and exits non-zero on mismatch, so task exit status alone carries
          # the verdict. The literals are literals, and diagnostics report a line's position
          # rather than its text; conformance-tests/README.md, "Self-asserting job tests",
          # says why both matter.
          import subprocess
          import sys

          EXPECTED = [
              "S3_RAW:s3://my-bucket/assets/teapot.obj",
              "S3_MAPPED:E:\\local\\assets\\teapot.obj",
              "S3_NAME:teapot.obj",
              "S3_PARENT:E:\\local\\assets",
              "HTTP_RAW:https://cdn.example.com/models/scene.obj",
              "HTTP_MAPPED:E:\\cache\\models\\scene.obj",
              "HTTP_NAME:scene.obj",
              "UNMAPPED_RAW:fsx://vol/data/file.bin",
              "UNMAPPED_VALUE:fsx://vol/data/file.bin",
              "UNMAPPED_NAME:file.bin",
              "UNMAPPED_PARTS:[\"fsx://vol\", \"data\", \"file.bin\"]",
          ]
          FORBIDDEN = []
          completed = subprocess.run(sys.argv[1:], capture_output=True, text=True)
          sys.stdout.write(completed.stdout)
          sys.stderr.write(completed.stderr)
          output = completed.stdout + completed.stderr

          problems = []
          if completed.returncode != 0:
              problems.append("command exited with code %d" % completed.returncode)
          problems += ["expected output line %d of %d not found" % (i, len(EXPECTED))
                       for i, line in enumerate(EXPECTED, 1) if line not in output]
          problems += ["forbidden output line %d of %d was present" % (i, len(FORBIDDEN))
                       for i, line in enumerate(FORBIDDEN, 1) if line in output]

          for problem in problems:
              sys.stderr.write("OPENJD_CONFORMANCE_ASSERT_FAILED: %s\n" % problem)
          if problems:
              sys.exit(1)
          sys.stdout.write("OPENJD_CONFORMANCE_ASSERT_OK: %d expected, %d forbidden\n"
                           % (len(EXPECTED), len(FORBIDDEN)))
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - python
          - -c
          - |
            print(r'S3_RAW:{{ RawParam.S3File }}')
            print(r'S3_MAPPED:{{ Param.S3File }}')
            print(r'S3_NAME:{{ Param.S3File.name }}')
            print(r'S3_PARENT:{{ Param.S3File.parent }}')
            print(r'HTTP_RAW:{{ RawParam.HttpFile }}')
            print(r'HTTP_MAPPED:{{ Param.HttpFile }}')
            print(r'HTTP_NAME:{{ Param.HttpFile.name }}')
            print(r'UNMAPPED_RAW:{{ RawParam.UnmappedFile }}')
            print(r'UNMAPPED_VALUE:{{ Param.UnmappedFile }}')
            print(r'UNMAPPED_NAME:{{ Param.UnmappedFile.name }}')
            print(r'UNMAPPED_PARTS:{{ Param.UnmappedFile.parts }}')
pathMapping:
  - source_path_format: URI
    source_path: s3://my-bucket/assets
    destination_path: "E:\\local\\assets"
  - source_path_format: URI
    source_path: https://cdn.example.com/models
    destination_path: "E:\\cache\\models"
expected:
  output:
  # RawParam always preserves the original URI
  - "S3_RAW:s3://my-bucket/assets/teapot.obj"
  - "S3_MAPPED:E:\\local\\assets\\teapot.obj"
  - "S3_NAME:teapot.obj"
  - "S3_PARENT:E:\\local\\assets"
  - "HTTP_RAW:https://cdn.example.com/models/scene.obj"
  - "HTTP_MAPPED:E:\\cache\\models\\scene.obj"
  - "HTTP_NAME:scene.obj"
  # Unmapped URI passes through as-is with URI path semantics
  - "UNMAPPED_RAW:fsx://vol/data/file.bin"
  - "UNMAPPED_VALUE:fsx://vol/data/file.bin"
  - "UNMAPPED_NAME:file.bin"
  - 'UNMAPPED_PARTS:["fsx://vol", "data", "file.bin"]'
