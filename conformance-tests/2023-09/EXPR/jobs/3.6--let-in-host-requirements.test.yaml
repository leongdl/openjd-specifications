template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  - FEATURE_BUNDLE_1
  name: TestJob
  parameterDefinitions:
  - name: NeedGpu
    type: BOOL
    default: true
  steps:
  - name: Step1
    let:
    - "gpu_count = 1 if Param.NeedGpu else 0"
    hostRequirements:
      amounts:
      - name: amount.worker.gpu
        min: "{{ gpu_count }}"
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["GPU:1"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'GPU:{{ gpu_count }}')
expected:
  output:
  - GPU:1
