template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    let:
    - 'p = path("/mnt/renders/scene.exr")'
    - 'pname = p.name'
    - 'pstem = p.stem'
    - 'psuffix = p.suffix'
    - 'psuffixes = p.suffixes'
    - 'pparent = p.parent'
    - 'pparts = p.parts'
    - 'noext = path("/mnt/renders/Makefile")'
    - 'noext_suffix = noext.suffix'
    - 'noext_suffixes = noext.suffixes'
    - 'root = path("/")'
    - 'root_name = root.name'
    - 'root_parent = root.parent'
    - 'root_parts = root.parts'
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        data: |
          # Self-asserting conformance wrapper. Runs `sys.argv[1:]` -- this case's original
          # command, expanded by the implementation -- echoes its output so a runner that
          # scans logs still sees the same lines, then checks that output against the
          # literals below and exits non-zero on mismatch, so task exit status alone carries
          # the verdict. The literals are literals, and diagnostics report a line's position
          # rather than its text; conformance-tests/README.md, "Self-asserting job tests",
          # says why both matter.
          import subprocess
          import sys

          EXPECTED_POSIX = [
              "NAME:scene.exr",
              "STEM:scene",
              "SUFFIX:.exr",
              "SUFFIXES:[\".exr\"]",
              "PARTS:[\"/\", \"mnt\", \"renders\", \"scene.exr\"]",
              "NOEXT_SUFFIX:",
              "NOEXT_SUFFIXES:[]",
              "ROOT_NAME:0 chars",
              "ROOT_PARENT_POSIX:/",
              "ROOT_PARTS:[\"/\"]",
              "PARENT:/mnt/renders",
          ]
          EXPECTED_WINDOWS = [
              "NAME:scene.exr",
              "STEM:scene",
              "SUFFIX:.exr",
              "SUFFIXES:[\".exr\"]",
              "PARTS:[\"/\", \"mnt\", \"renders\", \"scene.exr\"]",
              "NOEXT_SUFFIX:",
              "NOEXT_SUFFIXES:[]",
              "ROOT_NAME:0 chars",
              "ROOT_PARENT_POSIX:/",
              "ROOT_PARTS:[\"/\"]",
              "PARENT:\\mnt\\renders",
          ]
          EXPECTED = EXPECTED_WINDOWS if sys.platform == "win32" else EXPECTED_POSIX
          FORBIDDEN = []
          completed = subprocess.run(sys.argv[1:], capture_output=True, text=True)
          sys.stdout.write(completed.stdout)
          sys.stderr.write(completed.stderr)
          output = completed.stdout + completed.stderr

          problems = []
          if completed.returncode != 0:
              problems.append("command exited with code %d" % completed.returncode)
          problems += ["expected output line %d of %d not found" % (i, len(EXPECTED))
                       for i, line in enumerate(EXPECTED, 1) if line not in output]
          problems += ["forbidden output line %d of %d was present" % (i, len(FORBIDDEN))
                       for i, line in enumerate(FORBIDDEN, 1) if line in output]

          for problem in problems:
              sys.stderr.write("OPENJD_CONFORMANCE_ASSERT_FAILED: %s\n" % problem)
          if problems:
              sys.exit(1)
          sys.stdout.write("OPENJD_CONFORMANCE_ASSERT_OK: %d expected, %d forbidden\n"
                           % (len(EXPECTED), len(FORBIDDEN)))
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - python
          - -c
          - |
            print(r'NAME:{{ pname }}')
            print(r'STEM:{{ pstem }}')
            print(r'SUFFIX:{{ psuffix }}')
            print(r'SUFFIXES:{{ psuffixes }}')
            print(r'PARENT:{{ pparent }}')
            print(r'PARTS:{{ pparts }}')
            print(r'NOEXT_SUFFIX:{{ noext_suffix }}')
            print(r'NOEXT_SUFFIXES:{{ noext_suffixes }}')
            print(r'ROOT_NAME:{{ len(root_name) }} chars')
            print(r'ROOT_PARENT_POSIX:{{ root_parent.as_posix() }}')
            print(r'ROOT_PARTS:{{ root_parts }}')
expected:
  output:
  - NAME:scene.exr
  - STEM:scene
  - SUFFIX:.exr
  - 'SUFFIXES:[".exr"]'
  # parts returns list[string] — evaluated in TEMPLATE scope, same everywhere
  - 'PARTS:["/", "mnt", "renders", "scene.exr"]'
  - "NOEXT_SUFFIX:"
  - "NOEXT_SUFFIXES:[]"
  - "ROOT_NAME:0 chars"
  # root_parent tested via as_posix() to avoid Windows backslash-at-end-of-raw-string issue
  - "ROOT_PARENT_POSIX:/"
  - 'ROOT_PARTS:["/"]'
  output_posix:
  - PARENT:/mnt/renders
  output_windows:
  - PARENT:\mnt\renders
