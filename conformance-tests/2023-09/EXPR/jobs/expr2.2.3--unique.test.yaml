template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        data: |
          # Self-asserting conformance wrapper. Runs `sys.argv[1:]` -- this case's original
          # command, expanded by the implementation -- echoes its output so a runner that
          # scans logs still sees the same lines, then checks that output against the
          # literals below and exits non-zero on mismatch, so task exit status alone carries
          # the verdict. The literals are literals, and diagnostics report a line's position
          # rather than its text; conformance-tests/README.md, "Self-asserting job tests",
          # says why both matter.
          import subprocess
          import sys

          EXPECTED_POSIX = [
              "BOOL:[[True, False]]",
              "INT:[[3, 1, 2]]",
              "FLOAT:[[1.5, 2.5, 3.5]]",
              "STR:[a,b,c]",
              "RANGE_EXPR:[2]",
              "LIST_INT:[[[1, 2], [3, 4]]]",
              "LIST_STR:[[['a'], ['b']]]",
              "LIST_FLOAT:[[[1.0], [2.0]]]",
              "LIST_BOOL:[[[True], [False]]]",
              "EMPTY:[[]]",
              "ALL_SAME:[[7]]",
              "METHOD:[[1, 2, 3]]",
              "CHAINED:[[1, 2, 3]]",
              "PATH:[['/a', '/b']]",
              "LIST_PATH:[[['/a'], ['/b']]]",
          ]
          EXPECTED_WINDOWS = [
              "BOOL:[[True, False]]",
              "INT:[[3, 1, 2]]",
              "FLOAT:[[1.5, 2.5, 3.5]]",
              "STR:[a,b,c]",
              "RANGE_EXPR:[2]",
              "LIST_INT:[[[1, 2], [3, 4]]]",
              "LIST_STR:[[['a'], ['b']]]",
              "LIST_FLOAT:[[[1.0], [2.0]]]",
              "LIST_BOOL:[[[True], [False]]]",
              "EMPTY:[[]]",
              "ALL_SAME:[[7]]",
              "METHOD:[[1, 2, 3]]",
              "CHAINED:[[1, 2, 3]]",
              "PATH:[['\\\\a', '\\\\b']]",
              "LIST_PATH:[[['\\\\a'], ['\\\\b']]]",
          ]
          EXPECTED = EXPECTED_WINDOWS if sys.platform == "win32" else EXPECTED_POSIX
          FORBIDDEN = []
          completed = subprocess.run(sys.argv[1:], capture_output=True, text=True)
          sys.stdout.write(completed.stdout)
          sys.stderr.write(completed.stderr)
          output = completed.stdout + completed.stderr

          problems = []
          if completed.returncode != 0:
              problems.append("command exited with code %d" % completed.returncode)
          problems += ["expected output line %d of %d not found" % (i, len(EXPECTED))
                       for i, line in enumerate(EXPECTED, 1) if line not in output]
          problems += ["forbidden output line %d of %d was present" % (i, len(FORBIDDEN))
                       for i, line in enumerate(FORBIDDEN, 1) if line in output]

          for problem in problems:
              sys.stderr.write("OPENJD_CONFORMANCE_ASSERT_FAILED: %s\n" % problem)
          if problems:
              sys.exit(1)
          sys.stdout.write("OPENJD_CONFORMANCE_ASSERT_OK: %d expected, %d forbidden\n"
                           % (len(EXPECTED), len(FORBIDDEN)))
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - python
          - -c
          - |
            print(r'BOOL:[{{ repr_py(unique([True, False, True, False])) }}]')
            print(r'INT:[{{ repr_py(unique([3, 1, 2, 1, 3, 2])) }}]')
            print(r'FLOAT:[{{ repr_py(unique([1.5, 2.5, 1.5, 3.5])) }}]')
            print(r'STR:[{{ unique(["a", "b", "a", "c", "b"]).join(",") }}]')
            print(r"PATH:[{{ repr_py(unique([path('/a'), path('/b'), path('/a')])) }}]")
            print(r'RANGE_EXPR:[{{ len(unique([range_expr("1-3"), range_expr("4-6"), range_expr("1-3")])) }}]')
            print(r'LIST_INT:[{{ repr_py(unique([[1, 2], [3, 4], [1, 2]])) }}]')
            print(r"LIST_STR:[{{ repr_py(unique([['a'], ['b'], ['a']])) }}]")
            print(r'LIST_FLOAT:[{{ repr_py(unique([[1.0], [2.0], [1.0]])) }}]')
            print(r'LIST_BOOL:[{{ repr_py(unique([[True], [False], [True]])) }}]')
            print(r"LIST_PATH:[{{ repr_py(unique([[path('/a')], [path('/b')], [path('/a')]])) }}]")
            print(r'EMPTY:[{{ repr_py(unique([])) }}]')
            print(r'ALL_SAME:[{{ repr_py(unique([7, 7, 7])) }}]')
            print(r'METHOD:[{{ repr_py([1, 2, 1, 3, 2].unique()) }}]')
            print(r'CHAINED:[{{ repr_py([3, 1, 2, 1, 3].unique().sorted()) }}]')
expected:
  output:
  - "BOOL:[[True, False]]"
  - "INT:[[3, 1, 2]]"
  - "FLOAT:[[1.5, 2.5, 3.5]]"
  - STR:[a,b,c]
  - RANGE_EXPR:[2]
  - "LIST_INT:[[[1, 2], [3, 4]]]"
  - "LIST_STR:[[['a'], ['b']]]"
  - "LIST_FLOAT:[[[1.0], [2.0]]]"
  - "LIST_BOOL:[[[True], [False]]]"
  - "EMPTY:[[]]"
  - "ALL_SAME:[[7]]"
  - "METHOD:[[1, 2, 3]]"
  - "CHAINED:[[1, 2, 3]]"
  output_posix:
  - "PATH:[['/a', '/b']]"
  - "LIST_PATH:[[['/a'], ['/b']]]"
  output_windows:
  - "PATH:[['\\\\a', '\\\\b']]"
  - "LIST_PATH:[[['\\\\a'], ['\\\\b']]]"
