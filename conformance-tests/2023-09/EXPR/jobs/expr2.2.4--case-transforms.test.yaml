template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["UPPER:HELLO", "LOWER:hello", "CAP:Hello world", "TITLE:Hello World"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'UPPER:{{ upper("hello") }}')
            print(r'LOWER:{{ lower("HELLO") }}')
            print(r'CAP:{{ capitalize("hello world") }}')
            print(r'TITLE:{{ title("hello world") }}')
expected:
  output:
  - UPPER:HELLO
  - LOWER:hello
  - CAP:Hello world
  - TITLE:Hello World
