template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["TWO:1", "THREE:1", "LIST:2", "RANGE:3", "MIXED:1.0"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'TWO:{{ min(3, 1) }}')
            print(r'THREE:{{ min(3, 1, 2) }}')
            print(r'LIST:{{ min([5, 2, 8]) }}')
            print(r'RANGE:{{ min(range_expr("3-7")) }}')
            print(r'MIXED:{{ min(1, 2.5) }}')
expected:
  output:
  - TWO:1
  - THREE:1
  - LIST:2
  - RANGE:3
  - MIXED:1.0
