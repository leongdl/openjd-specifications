template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["TRUEDIV:3.5", "FLOORDIV:3", "EXACT:3.0", "FFLOORDIV:3"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'TRUEDIV:{{ 7 / 2 }}')
            print(r'FLOORDIV:{{ 7 // 2 }}')
            print(r'EXACT:{{ 6 / 2 }}')
            print(r'FFLOORDIV:{{ 7.0 // 2.0 }}')
expected:
  output:
  - TRUEDIV:3.5
  - FLOORDIV:3
  - EXACT:3.0
  - FFLOORDIV:3
