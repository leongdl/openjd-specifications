template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["SINGLE:frame_002", "MULTI:aXbXcX", "NO_MATCH:hello"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'SINGLE:{{ re_sub("frame_001", r"\d+", "002") }}')
            print(r'MULTI:{{ re_sub("a1b2c3", r"\d", "X") }}')
            print(r'NO_MATCH:{{ re_sub("hello", r"\d+", "X") }}')
expected:
  output:
  - SINGLE:frame_002
  - MULTI:aXbXcX
  - NO_MATCH:hello
