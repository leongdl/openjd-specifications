template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Frames
    type: RANGE_EXPR
    default: "1-5"
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["BASIC:[2, 4, 6]", "FILTER:[3, 4, 5]", "RANGE:[10, 20, 30, 40, 50]"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'BASIC:{{ [x * 2 for x in [1, 2, 3]] }}')
            print(r'FILTER:{{ [x for x in [1, 2, 3, 4, 5] if x > 2] }}')
            print(r'RANGE:{{ [x * 10 for x in Param.Frames] }}')
expected:
  output:
  - "BASIC:[2, 4, 6]"
  - "FILTER:[3, 4, 5]"
  - "RANGE:[10, 20, 30, 40, 50]"
