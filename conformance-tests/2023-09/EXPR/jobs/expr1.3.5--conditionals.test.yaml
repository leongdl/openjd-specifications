template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Flag
    type: BOOL
    default: true
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["TRUE:yes", "FALSE:no", "CALC:20"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'TRUE:{{ "yes" if Param.Flag else "no" }}')
            print(r'FALSE:{{ "yes" if not Param.Flag else "no" }}')
            print(r'CALC:{{ 10 * 2 if Param.Flag else 0 }}')
expected:
  output:
  - TRUE:yes
  - FALSE:no
  - CALC:20
