template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["WD_LEN:true", "WD_IS_PATH:true", "HAS_PM:false", "HAS_PM_COND:no", "PM_FILE_IS_PATH:.json"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'WD_LEN:{{ len(string(Session.WorkingDirectory)) > 0 }}')
            print(r'WD_IS_PATH:{{ len(Session.WorkingDirectory.name) > 0 }}')
            print(r'HAS_PM:{{ Session.HasPathMappingRules }}')
            print(r'HAS_PM_COND:{{ "yes" if Session.HasPathMappingRules else "no" }}')
            print(r'PM_FILE_IS_PATH:{{ Session.PathMappingRulesFile.suffix }}')
expected:
  output:
  - WD_LEN:true
  - WD_IS_PATH:true
  - HAS_PM:false
  - HAS_PM_COND:no
  - PM_FILE_IS_PATH:.json
