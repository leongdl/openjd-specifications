template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["FIND:[1]", "FIND_MISS:[-1]", "RFIND:[4]", "RFIND_MISS:[-1]", "INDEX:[1]", "RINDEX:[4]"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'FIND:[{{ find("hello", "ell") }}]')
            print(r'FIND_MISS:[{{ find("hello", "xyz") }}]')
            print(r'RFIND:[{{ rfind("abcabc", "bc") }}]')
            print(r'RFIND_MISS:[{{ rfind("hello", "xyz") }}]')
            print(r'INDEX:[{{ index("hello", "ell") }}]')
            print(r'RINDEX:[{{ rindex("abcabc", "bc") }}]')
expected:
  output:
  - FIND:[1]
  - FIND_MISS:[-1]
  - RFIND:[4]
  - RFIND_MISS:[-1]
  - INDEX:[1]
  - RINDEX:[4]
