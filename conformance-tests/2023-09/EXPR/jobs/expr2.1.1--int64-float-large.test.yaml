# Float values outside int64 range are fine
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["POS:9223372036854775808.0", "NEG:-9.223372036854776e+18"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'POS:{{ 9223372036854775808.0 }}')
            print(r'NEG:{{ -9223372036854775809.0 }}')
expected:
  output:
  - "POS:9223372036854775808.0"
  - "NEG:-9.223372036854776e+18"  # unary negation removes pass-through, so shortest repr
