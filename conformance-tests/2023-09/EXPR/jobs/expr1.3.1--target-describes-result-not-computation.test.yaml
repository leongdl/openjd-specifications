# Expression Language §1.3.1: the target type describes the expression's
# result, never its computation. Each bare "{{expr}}" args item has target
# type `string? | list[string]` (§1.3.2), so a `list[string]` target is in
# play — but it must not be unified with `sorted(list[T1]) -> list[T1]`'s
# return type to bind T1=string into the argument. The argument evaluates
# unconstrained, the sort is numeric, and only the *result* coerces to
# list[string] and flattens into the args. An implementation that binds the
# target through the return type would coerce [10, 2] to ["10", "2"] first
# and sort lexicographically, producing args in the order 10, 2.
#
# The min() item additionally pins that overload resolution and execution do
# not depend on the target: min's signatures return a type variable, so a
# target-filtered candidate set may be empty, but the call must still
# evaluate normally with the int result coercing to string.
template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Ints
    type: LIST[INT]
    default: [10, 2]
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        data: |
          # Self-asserting conformance wrapper. Runs `sys.argv[1:]` -- this case's original
          # command, expanded by the implementation -- echoes its output so a runner that
          # scans logs still sees the same lines, then checks that output against the
          # literals below and exits non-zero on mismatch, so task exit status alone carries
          # the verdict. The literals are literals, and diagnostics report a line's position
          # rather than its text; conformance-tests/README.md, "Self-asserting job tests",
          # says why both matter.
          import subprocess
          import sys

          EXPECTED = ["ARGS:2,10,SEP,2,10,SEP,2"]
          FORBIDDEN = ["ARGS:10,2"]
          completed = subprocess.run(sys.argv[1:], capture_output=True, text=True)
          sys.stdout.write(completed.stdout)
          sys.stderr.write(completed.stderr)
          output = completed.stdout + completed.stderr

          problems = []
          if completed.returncode != 0:
              problems.append("command exited with code %d" % completed.returncode)
          problems += ["expected output line %d of %d not found" % (i, len(EXPECTED))
                       for i, line in enumerate(EXPECTED, 1) if line not in output]
          problems += ["forbidden output line %d of %d was present" % (i, len(FORBIDDEN))
                       for i, line in enumerate(FORBIDDEN, 1) if line in output]

          for problem in problems:
              sys.stderr.write("OPENJD_CONFORMANCE_ASSERT_FAILED: %s\n" % problem)
          if problems:
              sys.exit(1)
          sys.stdout.write("OPENJD_CONFORMANCE_ASSERT_OK: %d expected, %d forbidden\n"
                           % (len(EXPECTED), len(FORBIDDEN)))
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - python
          - -c
          - |
            import sys
            print('ARGS:' + ','.join(sys.argv[1:]))
          - "{{ sorted(Param.Ints) }}"
          - SEP
          - "{{ Param.Ints.sorted() }}"
          - SEP
          - "{{ min(Param.Ints) }}"
expected:
  output:
  - "ARGS:2,10,SEP,2,10,SEP,2"
  forbidden:
  # Lexicographic order would mean the list[string] target was bound
  # through the return type and coerced the argument before sorting.
  - "ARGS:10,2"
