template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  parameterDefinitions:
  - name: Frames
    type: RANGE_EXPR
    default: "1-5"
  steps:
  - name: Step1
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["LIST:3", "STR:5", "RANGE:5", "PATH:8"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - |
            print(r'LIST:{{ len([10, 20, 30]) }}')
            print(r'STR:{{ len("hello") }}')
            print(r'RANGE:{{ len(Param.Frames) }}')
            print(r'PATH:{{ len(path("/mnt/out")) }}')
expected:
  output:
  - LIST:3
  - STR:5
  - RANGE:5
  - PATH:8
