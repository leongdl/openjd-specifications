template:
  specificationVersion: jobtemplate-2023-09
  extensions:
  - EXPR
  name: TestJob
  steps:
  - name: Step1
    stepEnvironments:
    - name: StepEnv
      script:
        let:
        - "prefix = 'HELLO'"
        - "suffix = 'WORLD'"
        - "combined = prefix + '_' + suffix"
        actions:
          onEnter:
            command: python
            args:
            - -c
            - "print('openjd_env: MSG={{ combined }}')"
    script:
      embeddedFiles:
      - name: OpenJDConformanceAssert
        type: TEXT
        dataFile: _conformance_assert.py
      - name: OpenJDConformanceExpect
        type: TEXT
        data: |
          {"expected": ["MSG:HELLO_WORLD"]}
      actions:
        onRun:
          command: python
          args:
          - '{{Task.File.OpenJDConformanceAssert}}'
          - '{{Task.File.OpenJDConformanceExpect}}'
          - python
          - -c
          - import os; print('MSG:' + os.environ.get('MSG', ''))
expected:
  output:
  - MSG:HELLO_WORLD
