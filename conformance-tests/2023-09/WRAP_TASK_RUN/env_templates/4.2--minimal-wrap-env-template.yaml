specificationVersion: environment-2023-09
extensions:
- WRAP_TASK_RUN
environment:
  name: MinimalWrapEnv
  script:
    actions:
      onEnter:
        command: echo
        args: ["entered"]
      onWrapTaskRun:
        command: echo
        args: ["wrapped", "{{Task.Command}}"]
      onExit:
        command: echo
        args: ["exited"]
