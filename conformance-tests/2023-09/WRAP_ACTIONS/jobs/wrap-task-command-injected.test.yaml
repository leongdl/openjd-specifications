# WrappedAction.Command must reach the wrap action as the exact command from the
# step's onRun. The wrap script echoes `CMD=<WrappedAction.Command>` so a simple
# substring check can verify the value.
template:
  specificationVersion: jobtemplate-2023-09
  name: TaskCommandInjected
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: maya-batch
          args: ["-render", "scene.ma"]

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  - EXPR
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: bash
          args:
          - "-c"
          - "echo CMD={{WrappedAction.Command}}"
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"

runOn:
- posix

expected:
  output:
  - CMD=maya-batch
  forbidden:
  # The real command must never actually run — it's not on PATH, which is
  # also a useful indicator: if the wrap didn't intercept, the runtime
  # would try to exec `maya-batch` and error with a command-not-found.
  - "No such file or directory"
