# An outer environment without onWrapTaskRun must not swallow the task.
# The runtime must walk the environment stack and run the innermost wrap
# action it finds — here, the inner env's wrap.
template:
  specificationVersion: jobtemplate-2023-09
  name: OuterWithoutWrapIgnored
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args: ["ORIGINAL"]

environments:
# Outer environment: only onEnter, no wrap. This env sets an env var to
# prove it ran — the inner wrap later echoes that value.
- specificationVersion: environment-2023-09
  environment:
    name: PlainEnterEnv
    script:
      actions:
        onEnter:
          command: sh
          args:
          - "-c"
          - "echo 'openjd_env: OUTER_VAR=outer_value'"

# Inner environment: defines onWrapTaskRun.
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  environment:
    name: InnerWrap
    script:
      actions:
        onWrapTaskRun:
          command: sh
          args:
          - "-c"
          - "echo WRAP_RAN; echo OUTER=$OUTER_VAR"

runOn:
- posix

expected:
  output:
  - WRAP_RAN
  # The wrap action runs with the env vars from earlier environments,
  # proving both envs were active.
  - OUTER=outer_value
  forbidden:
  - ORIGINAL
