# RFC 0008 "Recommended test case" #4 — shell globbing.
# Glob characters (*, ?, [abc]) must reach the wrap script unexpanded.
# repr_sh() quotes them so the shell does not expand them at wrap time.
template:
  specificationVersion: jobtemplate-2023-09
  name: GlobCharactersLiteral
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: ls
          args:
          - "*.txt"
          - "?.log"
          - "[abc]*"

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  - EXPR
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: bash
          args:
          - "-c"
          - "printf 'ARG=%s\\n' {{ repr_sh(WrappedAction.Args) }}"
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"

runOn:
- posix

expected:
  output:
  - "ARG=*.txt"
  - "ARG=?.log"
  - "ARG=[abc]*"
