# RFC 0008: wrap hooks work in stepEnvironments, not just jobEnvironments.
template:
  specificationVersion: jobtemplate-2023-09
  name: WrapInStepEnvironment
  steps:
  - name: Step1
    stepEnvironments:
    - name: StepWrapEnv
      script:
        actions:
          onWrapEnvEnter:
            command: echo
            args: ["wrap-enter"]
          onWrapTaskRun:
            command: echo
            args: ["WRAP_FROM_STEP_ENV"]
          onWrapEnvExit:
            command: echo
            args: ["wrap-exit"]
    script:
      actions:
        onRun:
          command: echo
          args: ["ORIGINAL_TASK"]
  extensions:
  - WRAP_ACTIONS
  - EXPR

runOn:
- posix

expected:
  output:
  - WRAP_FROM_STEP_ENV
  forbidden:
  - ORIGINAL_TASK
