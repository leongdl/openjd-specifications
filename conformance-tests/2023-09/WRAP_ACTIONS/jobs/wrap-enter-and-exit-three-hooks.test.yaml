# RFC 0008: a single wrap environment can declare all three hooks
# (onWrapEnter, onWrapTaskRun, onWrapExit). This test validates that
# all three intercept correctly in one session, with the inner env's
# host-side onEnter/onExit replaced by the wrap scripts.
template:
  specificationVersion: jobtemplate-2023-09
  name: ThreeHooks
  jobEnvironments:
  - name: InnerEnv
    script:
      actions:
        onEnter:
          command: echo
          args: ["INNER_ENTER_HOST"]
        onExit:
          command: echo
          args: ["INNER_EXIT_HOST"]
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args: ["ORIGINAL_TASK"]

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnter:
          command: sh
          args:
          - "-c"
          - "echo WRAP_ENTER_NAME={{Env.Wrapped.Name}}"
        onWrapTaskRun:
          command: sh
          args:
          - "-c"
          - "echo WRAP_TASK_CMD={{Task.Command}}"
        onWrapExit:
          command: sh
          args:
          - "-c"
          - "echo WRAP_EXIT_NAME={{Env.Wrapped.Name}}"

runOn:
- posix

expected:
  output:
  - WRAP_ENTER_NAME=InnerEnv
  - WRAP_TASK_CMD=echo
  - WRAP_EXIT_NAME=InnerEnv
  forbidden:
  - INNER_ENTER_HOST
  - INNER_EXIT_HOST
  - ORIGINAL_TASK
