# The wrap action isn't required to reference Task.Command at all — it can
# simply run its own logic. This test verifies the wrap runs successfully
# even when it ignores every injected Task.* symbol.
template:
  specificationVersion: jobtemplate-2023-09
  name: WrapIgnoresTaskSymbols
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args: ["ORIGINAL"]

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapTaskRun:
          command: echo
          args: ["SELF_CONTAINED"]

runOn:
- posix

expected:
  output:
  - SELF_CONTAINED
  forbidden:
  - ORIGINAL
