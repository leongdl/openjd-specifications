# RFC 0008 Test 3: an inner environment's onEnter that sets
# `runOnHost: true` must run on the host directly and bypass the outer
# environment's onWrapEnter. This is the opt-out path that lets actions
# requiring host context (mounting NFS shares, fetching credentials)
# work alongside a wrapping container env.
template:
  specificationVersion: jobtemplate-2023-09
  # The runOnHost field on the inner env's onEnter is gated on
  # WRAP_ACTIONS, so the job template must declare the extension too.
  extensions:
  - WRAP_ACTIONS
  name: RunOnHostBypass
  jobEnvironments:
  - name: InnerEnv
    script:
      actions:
        onEnter:
          command: echo
          args: ["HOST_ENTER_RAN"]
          runOnHost: true
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args: ["TASK_RAN"]

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnter:
          command: echo
          args: ["WRAP_ENTER_RAN"]

runOn:
- posix

expected:
  output:
  - HOST_ENTER_RAN
  - TASK_RAN
  forbidden:
  # The outer wrap hook must NOT have intercepted the inner onEnter
  # because runOnHost: true was set.
  - WRAP_ENTER_RAN
