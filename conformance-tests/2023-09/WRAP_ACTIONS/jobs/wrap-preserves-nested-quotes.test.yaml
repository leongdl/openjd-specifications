# RFC 0008 "Recommended test case" #1 — nested quoting.
# Arguments containing both single and double quotes must survive injection
# and be quoted safely by repr_sh() in the wrap script.
template:
  specificationVersion: jobtemplate-2023-09
  name: NestedQuotes
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args:
          - "O'Reilly's Guide"
          - 'say "hi"'

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  - EXPR
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: bash
          args:
          - "-c"
          # repr_sh() must quote each argument so the shell sees them as
          # literal tokens. `printf '%s\n'` then prints each argv on its
          # own line.
          - "printf 'ARG=%s\\n' {{ repr_sh(WrappedAction.Args) }}"
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"

runOn:
- posix

expected:
  output:
  - "ARG=O'Reilly's Guide"
  - 'ARG=say "hi"'
