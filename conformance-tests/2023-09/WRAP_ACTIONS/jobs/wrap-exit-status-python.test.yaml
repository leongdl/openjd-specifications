# RFC 0008: Cross-platform (Python) variant of exit-status propagation.
# The wrapped action exits non-zero; the wrap script must propagate it.
# Runs on all platforms.
template:
  specificationVersion: jobtemplate-2023-09
  name: ExitStatusPython
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import sys; sys.exit(42)"]

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  - EXPR
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnvEnter:
          command: python
          args:
          - "-c"
          - "import subprocess,sys; sys.exit(subprocess.run([{{repr_py(WrappedAction.Command)}}]+{{repr_py(WrappedAction.Args)}}).returncode)"
        onWrapTaskRun:
          command: python
          args:
          - "-c"
          - "import subprocess,sys; sys.exit(subprocess.run([{{repr_py(WrappedAction.Command)}}]+{{repr_py(WrappedAction.Args)}}).returncode)"
        onWrapEnvExit:
          command: python
          args:
          - "-c"
          - "import subprocess,sys; sys.exit(subprocess.run([{{repr_py(WrappedAction.Command)}}]+{{repr_py(WrappedAction.Args)}}).returncode)"

expected:
  taskFailure:
    exitCode: 42
