# The wrap action is not required to reference WrappedAction.* at all — it
# can run its own logic. This test verifies the wrap runs successfully
# even when it ignores every injected variable.
template:
  specificationVersion: jobtemplate-2023-09
  name: WrapIgnoresWrappedActionSymbols
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args: ["ORIGINAL"]

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  - EXPR
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: echo
          args: ["SELF_CONTAINED"]
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"

runOn:
- posix

expected:
  output:
  - SELF_CONTAINED
  forbidden:
  - ORIGINAL
