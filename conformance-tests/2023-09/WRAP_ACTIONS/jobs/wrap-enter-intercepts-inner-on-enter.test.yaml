# RFC 0008 Test 1: an outer environment's onWrapEnter must run instead
# of an inner environment's onEnter, with `Env.Wrapped.Name` resolving
# to the inner environment's name. The wrap script writes a marker line
# that the inner env's host-side onEnter would never produce.
template:
  specificationVersion: jobtemplate-2023-09
  name: WrapEnterIntercepts
  jobEnvironments:
  - name: InnerEnv
    script:
      actions:
        onEnter:
          command: echo
          args: ["INNER_ON_ENTER_HOST"]
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args: ["TASK_RAN"]

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnter:
          command: sh
          args:
          - "-c"
          - "echo WRAP_ENTER_FOR={{Env.Wrapped.Name}}"

runOn:
- posix

expected:
  output:
  - WRAP_ENTER_FOR=InnerEnv
  - TASK_RAN
  forbidden:
  - INNER_ON_ENTER_HOST
