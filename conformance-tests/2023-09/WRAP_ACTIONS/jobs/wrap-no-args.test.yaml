# RFC 0008: WrappedAction.Args is a list[string]. When the wrapped action
# has no args, it must surface as an empty list (not null / not missing).
template:
  specificationVersion: jobtemplate-2023-09
  name: WrappedActionNoArgs
  steps:
  - name: Step1
    script:
      actions:
        # No args: just a command.
        onRun:
          command: "true"

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  - EXPR
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: bash
          args:
          - "-c"
          # Iterate WrappedAction.Args; the loop should run zero times.
          - |
            for a in {{ repr_sh(WrappedAction.Args) }}; do
              echo SAW_ARG=$a
            done
            echo CMD={{WrappedAction.Command}}
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"

runOn:
- posix

expected:
  output:
  - "CMD=true"
  forbidden:
  - SAW_ARG=
