# Minimal wrap test — confirms the runtime runs `onWrapTaskRun` in place of
# the step's `onRun`. The wrap action prints a sentinel that the step
# itself would never emit, so the sentinel's presence proves the wrap ran.
template:
  specificationVersion: jobtemplate-2023-09
  name: WrapIntercepts
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args: ["ORIGINAL_ONRUN"]

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  - EXPR
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnvEnter:
          command: python
          args:
          - "-c"
          - "import subprocess,sys;sys.exit(subprocess.run([{{repr_py(WrappedAction.Command)}}]+{{repr_py(WrappedAction.Args)}}).returncode)"
        onWrapTaskRun:
          command: echo
          args: ["WRAP_SENTINEL"]
        onWrapEnvExit:
          command: python
          args:
          - "-c"
          - "import subprocess,sys;sys.exit(subprocess.run([{{repr_py(WrappedAction.Command)}}]+{{repr_py(WrappedAction.Args)}}).returncode)"

expected:
  output:
  - WRAP_SENTINEL
  forbidden:
  - ORIGINAL_ONRUN
