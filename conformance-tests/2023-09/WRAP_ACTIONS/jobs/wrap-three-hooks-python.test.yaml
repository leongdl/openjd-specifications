# RFC 0008: Cross-platform (Python) variant of the three-hooks test.
# Validates that all three wrap hooks intercept correctly using Python
# as the wrap-script interpreter. Runs on all platforms.
template:
  specificationVersion: jobtemplate-2023-09
  name: ThreeHooksPython
  jobEnvironments:
  - name: InnerEnv
    script:
      actions:
        onEnter:
          command: echo
          args: ["INNER_ENTER_NORMAL"]
        onExit:
          command: echo
          args: ["INNER_EXIT_NORMAL"]
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args: ["ORIGINAL_TASK"]

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  - EXPR
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnvEnter:
          command: python
          args:
          - "-c"
          - "print('WRAP_ENTER_ENV='+{{repr_py(WrappedEnv.Name)}})"
        onWrapTaskRun:
          command: python
          args:
          - "-c"
          - "print('WRAP_TASK_CMD='+{{repr_py(WrappedAction.Command)}})"
        onWrapEnvExit:
          command: python
          args:
          - "-c"
          - "print('WRAP_EXIT_ENV='+{{repr_py(WrappedEnv.Name)}})"

expected:
  output:
  - WRAP_ENTER_ENV=InnerEnv
  - WRAP_TASK_CMD=echo
  - WRAP_EXIT_ENV=InnerEnv
  forbidden:
  - INNER_ENTER_NORMAL
  - INNER_EXIT_NORMAL
  - ORIGINAL_TASK
