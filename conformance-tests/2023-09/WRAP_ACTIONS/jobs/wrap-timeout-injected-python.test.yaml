# RFC 0008: Cross-platform (Python) variant of timeout injection.
# Verifies WrappedAction.Timeout surfaces correctly. Runs on all platforms.
template:
  specificationVersion: jobtemplate-2023-09
  name: TimeoutInjectedPython
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args: ["placeholder"]
          timeout: 300

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  - EXPR
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnvEnter:
          command: python
          args:
          - "-c"
          - "import subprocess,sys; sys.exit(subprocess.run([{{repr_py(WrappedAction.Command)}}]+{{repr_py(WrappedAction.Args)}}).returncode)"
        onWrapTaskRun:
          command: python
          args:
          - "-c"
          - "print('TIMEOUT={{WrappedAction.Timeout}}')"
        onWrapEnvExit:
          command: python
          args:
          - "-c"
          - "import subprocess,sys; sys.exit(subprocess.run([{{repr_py(WrappedAction.Command)}}]+{{repr_py(WrappedAction.Args)}}).returncode)"

expected:
  output:
  - TIMEOUT=300
