# RFC 0008 "Recommended test case" #3 — path traversal.
# The runtime must not resolve, normalize, or reject `../` paths. The wrap
# script + container boundary is what prevents escape; the injection layer
# simply forwards the bytes.
template:
  specificationVersion: jobtemplate-2023-09
  name: PathTraversalLiteral
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args:
          - "../../../etc/passwd"
          - "/tmp/../etc/shadow"

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  - EXPR
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: bash
          args:
          - "-c"
          - "printf 'ARG=%s\\n' {{ repr_sh(WrappedAction.Args) }}"
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"

runOn:
- posix

expected:
  output:
  - "ARG=../../../etc/passwd"
  - "ARG=/tmp/../etc/shadow"
