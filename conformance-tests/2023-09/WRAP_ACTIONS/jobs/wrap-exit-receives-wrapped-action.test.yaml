# RFC 0008: WrappedAction.* is in scope inside onWrapEnvExit. Verifies the
# inner env's onExit command and args are surfaced via WrappedAction.*.
template:
  specificationVersion: jobtemplate-2023-09
  name: WrapExitReceivesWrappedAction
  jobEnvironments:
  - name: InnerEnv
    script:
      actions:
        onEnter:
          command: echo
          args: ["inner-enter"]
        onExit:
          command: inner-exit-cmd
          args:
          - "--cleanup"
          - "/tmp/work"
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args: ["TASK"]

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  - EXPR
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "echo NAME={{WrappedEnv.Name}}; echo CMD={{WrappedAction.Command}}; printf 'ARG=%s\\n' {{ repr_sh(WrappedAction.Args) }}"

runOn:
- posix

expected:
  output:
  - NAME=InnerEnv
  - CMD=inner-exit-cmd
  - "ARG=--cleanup"
  - ARG=/tmp/work
