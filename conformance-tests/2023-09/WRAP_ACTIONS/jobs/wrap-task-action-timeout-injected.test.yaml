# WrappedAction.Timeout surfaces the timeout of the original onRun action so
# the wrap script can propagate it (e.g., `docker stop --timeout N`).
template:
  specificationVersion: jobtemplate-2023-09
  name: WrappedActionTimeoutInjected
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args: ["placeholder"]
          timeout: 123

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  - EXPR
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: bash
          args:
          - "-c"
          - "echo TIMEOUT={{WrappedAction.Timeout}}"
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"

runOn:
- posix

expected:
  output:
  - TIMEOUT=123
