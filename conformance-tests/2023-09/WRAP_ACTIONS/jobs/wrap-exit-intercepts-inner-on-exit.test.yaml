# RFC 0008 Test 2: an outer environment's onWrapExit must run instead
# of an inner environment's onExit, with `Env.Wrapped.Name` resolving
# to the inner environment's name. The wrap script writes a marker that
# the inner env's host-side onExit would never produce.
template:
  specificationVersion: jobtemplate-2023-09
  name: WrapExitIntercepts
  jobEnvironments:
  - name: InnerEnv
    script:
      actions:
        onExit:
          command: echo
          args: ["INNER_ON_EXIT_HOST"]
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args: ["TASK_RAN"]

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapExit:
          command: sh
          args:
          - "-c"
          - "echo WRAP_EXIT_FOR={{Env.Wrapped.Name}}"

runOn:
- posix

expected:
  output:
  - WRAP_EXIT_FOR=InnerEnv
  - TASK_RAN
  forbidden:
  - INNER_ON_EXIT_HOST
