# RFC 0008: WrappedAction.* is in scope inside onWrapEnvEnter, not just
# onWrapTaskRun. The wrap hook receives the inner env's onEnter command,
# args, and timeout via the same WrappedAction namespace.
template:
  specificationVersion: jobtemplate-2023-09
  name: WrapEnterReceivesWrappedAction
  jobEnvironments:
  - name: InnerEnv
    script:
      actions:
        onEnter:
          command: inner-enter-cmd
          args:
          - "--flag"
          - "value"
          timeout: 99
  steps:
  - name: Step1
    script:
      actions:
        onRun:
          command: echo
          args: ["TASK"]

environments:
- specificationVersion: environment-2023-09
  extensions:
  - WRAP_ACTIONS
  - EXPR
  environment:
    name: WrapEnv
    script:
      actions:
        onWrapEnvEnter:
          command: bash
          args:
          - "-c"
          - "echo NAME={{WrappedEnv.Name}}; echo CMD={{WrappedAction.Command}}; echo TIMEOUT={{WrappedAction.Timeout}}; printf 'ARG=%s\\n' {{ repr_sh(WrappedAction.Args) }}"
        onWrapTaskRun:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"
        onWrapEnvExit:
          command: bash
          args:
          - "-c"
          - "{{ repr_sh(WrappedAction.Command) }} {{ repr_sh(WrappedAction.Args) }}"

runOn:
- posix

expected:
  output:
  - NAME=InnerEnv
  - CMD=inner-enter-cmd
  - TIMEOUT=99
  - "ARG=--flag"
  - ARG=value
  - TASK
