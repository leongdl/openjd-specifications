# RFC 0008 all-or-nothing rule: defining onWrapEnvEnter and onWrapTaskRun
# without onWrapEnvExit is invalid.
specificationVersion: environment-2023-09
extensions:
- WRAP_ACTIONS
- EXPR
environment:
  name: MissingWrapExit
  script:
    actions:
      onWrapEnvEnter:
        command: echo
        args: ["{{WrappedEnv.Name}}"]
      onWrapTaskRun:
        command: echo
        args: ["{{WrappedAction.Command}}"]
