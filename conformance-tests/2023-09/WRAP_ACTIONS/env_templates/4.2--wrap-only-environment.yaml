# RFC 0008: the three wrap hooks alone (without onEnter/onExit) are sufficient.
specificationVersion: environment-2023-09
extensions:
- WRAP_ACTIONS
- EXPR
environment:
  name: WrapOnlyEnv
  script:
    actions:
      onWrapEnvEnter:
        command: echo
        args: ["{{WrappedEnv.Name}}"]
      onWrapTaskRun:
        command: echo
        args: ["{{WrappedAction.Command}}"]
      onWrapEnvExit:
        command: echo
        args: ["{{WrappedEnv.Name}}"]
